# Blueprint Render — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: metas-avinor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      streamlit run streamlit_app.py
      --server.port=$PORT
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TEST_DB_HOST
        sync: false
      - key: TEST_DB_PORT
        value: "3306"
      - key: TEST_DB_USER
        sync: false
      - key: TEST_DB_PASSWORD
        sync: false
      - key: TEST_DB_NAME
        value: EXTRACTOR
      - key: NEON_DATABASE_URL
        sync: false
